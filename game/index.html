<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIM FARM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236ab04c'/%3E%3Cpath d='M16 25V13' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M16 15c-5 0-7-3-7-6 4 0 7 2 7 6zM16 15c5 0 7-3 7-6-4 0-7 2-7 6z' fill='%23fff'/%3E%3C/svg%3E">
<!-- Mitr carries Latin, digits and Thai in one design, so the two languages read
     as the same game. Self-hosted, so nothing is fetched at runtime.
     Generated by tools/fetch-fonts.mjs. -->
<link rel="stylesheet" href="./assets/fonts/fonts.css">
<style>
  html{background:#1d2b1a}
  /* The body must not paint, or it would cover the backdrop layer beneath it. */
  html,body{margin:0;height:100%;background-color:transparent;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;
       font-family:'Mitr','Noto Sans Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  /* The play area is a fixed-shape painted scene, so fitting it to a screen of
     a different shape always leaves a margin. Rather than show black there,
     this layer carries the current scene blown up and blurred, so the margin
     reads as depth-of-field around the board instead of a letterbox. */
  #backdrop{position:fixed;inset:0;z-index:0;background:#1d2b1a center/cover no-repeat;
            filter:blur(26px) brightness(.62) saturate(1.1);transform:scale(1.12);
            transition:background-image .25s ease-out}
  #game{width:100%;height:100%;flex:none;position:relative;z-index:1}
  canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}


  /* Two things worth having on a phone: fullscreen, because browser chrome eats
     the screen, and a way to say "no, let me hold it upright" when the board has
     been turned to fill the display. */
  .chrome-btn{position:fixed;right:10px;z-index:9;display:none;
              width:42px;height:42px;border:0;border-radius:11px;background:#1a1208aa;color:#fdf1d6;
              font-size:19px;line-height:42px;padding:0;cursor:pointer}
  #full{bottom:10px}
  #orient{bottom:60px;font-size:17px}
  body.touch .chrome-btn{display:block}
  body:not(.portrait) #orient{display:none}
</style>
</head>
<body><div id="backdrop"></div><div id="game"></div>
<button id="full" class="chrome-btn" title="Fullscreen" aria-label="Fullscreen">&#9974;</button>
<button id="orient" class="chrome-btn" title="Rotate" aria-label="Rotate">&#8635;</button>
<script>
  // Kept out of the bundle so orientation and touch are right on the first paint.
  (function () {
    const body = document.body
    // Both halves matter: a headless or remote-desktop browser reports no hover
    // while having no touch digitiser, and would otherwise look like a phone.
    const touch = (navigator.maxTouchPoints || 0) > 0 && matchMedia('(pointer: coarse)').matches
    body.classList.toggle('touch', touch)

    document.getElementById('full').addEventListener('click', () => {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.()
    })
    document.getElementById('orient').addEventListener('click', () => window.__viewport?.toggleUpright())

  })()
</script>
<script type="module" src="./src/main.js"></script></body>
</html>
